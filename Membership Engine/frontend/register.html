<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Membership Engine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="/" class="logo">Membership Engine</a>
        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Create Account</h2>
            <div id="error-message" class="alert alert-error hidden"></div>
            <div id="success-message" class="alert alert-success hidden"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role">
                        <option value="User">User</option>
                        <option value="Admin">Admin (For Demo Purposes)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-full">Register</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" class="text-link">Login</a>
            </p>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
