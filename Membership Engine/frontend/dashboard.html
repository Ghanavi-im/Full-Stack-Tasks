<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Membership Engine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="/" class="logo">Membership Engine</a>
        <nav>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>
    <main>
        <div class="dashboard-header">
            <h2 id="welcome-message">Welcome!</h2>
            <div id="status-badge" class="status-badge">Loading Status...</div>
        </div>

        <section class="mb-2">
            <h3 style="font-size: 1.4rem; margin-bottom: 1rem;">Your Subscription</h3>
            <div id="subscription-info" class="card">
                <p>Loading your subscription...</p>
            </div>
            
            <div style="margin-top: 1.5rem;">
                <button id="test-feature-btn" class="btn" style="max-width: 300px;">Test Premium Feature Access</button>
                <div id="feature-result" class="alert hidden" style="margin-top: 1rem;"></div>
            </div>
        </section>

        <section>
            <h3 style="font-size: 1.4rem; margin-bottom: 1rem;">Available Plans</h3>
            <div id="plans-container" class="grid">
                <!-- Plans injected here -->
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn() || localStorage.getItem('role') === 'Admin') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('welcome-message').innerText = `Welcome, ${localStorage.getItem('name')}!`;
            loadMySubscription();
            loadPlans(true);

            document.getElementById('logout-btn').addEventListener('click', logout);
            
            document.getElementById('test-feature-btn').addEventListener('click', testPremiumFeature);
        });
    </script>
</body>
</html>
