<!DOCTYPE tiered-membership>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Engine</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="/" class="logo">Membership Engine</a>
        <nav id="nav-menu">
            <!-- Injected by app.js -->
        </nav>
    </header>
    <main>
        <div class="text-center mt-2" style="padding: 4rem 1rem;">
            <h1 style="font-size: 3.5rem; margin-bottom: 1.5rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Welcome to Membership Engine</h1>
            <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6;">A membership and subscription platform.</p>
            <div id="cta-buttons" style="display: flex; justify-content: center; gap: 1rem;">
                <a href="login.html" class="btn" style="padding: 0.8rem 2rem; font-size: 1.1rem;">Login</a>
                <a href="register.html" class="btn" style="padding: 0.8rem 2rem; font-size: 1.1rem; background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--card-border); box-shadow: none;">Register</a>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(isLoggedIn()) {
                const role = localStorage.getItem('role');
                window.location.href = role === 'Admin' ? 'admin.html' : 'dashboard.html';
            }
        });
    </script>
</body>
</html>
