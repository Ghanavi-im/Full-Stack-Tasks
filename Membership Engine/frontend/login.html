<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Membership Engine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="/" class="logo">Membership Engine</a>
        <nav>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Sign In</h2>
            <div id="error-message" class="alert alert-error hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-full">Login</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" class="text-link">Register</a>
            </p>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
